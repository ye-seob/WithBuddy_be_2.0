openapi: 3.0.3
info:
  title: WithBuddy Server API
  version: 1.0.11
servers:
  - url: http://localhost:3000
tags:
  - name: User
    description: User API Tag
  - name: Auth
    description: Auth API Tag
  - name: Matching
    description: Matching API Tag
  - name: Post
    description: Post API Tag
  - name: Comment
    description: Comment API Tag

#api paths
paths:
  # ======================= 유저 API ======================

  # 회원가입 API
  /api/v1/users/signup:
    post:
      tags:
        - User
      summary: User Signup
      description: 회원가입 API
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: "테스트"
                pin:
                  type: string
                  example: "1234"
                studentId:
                  type: string
                  example: "2023216001"
                email:
                  type: string
                  example: "ys031027@skuniv.ac.kr"
                instaId:
                  type: string
                  example: "ye.seob_"
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultType:
                    type: string
                    example: "SUCCESS"
                  error:
                    type: string
                    nullable: true
                    example: null
                  success:
                    type: object
                    properties:
                      userId:
                        type: integer
                        example: 6
                      name:
                        type: string
                        example: "테스트"
                      studentId:
                        type: string
                        example: "2023216001"
                      email:
                        type: string
                        example: "ys031027@skuniv.ac.kr"
                      kakaoId:
                        type: string
                        nullable: true
                        example: null
                      instaId:
                        type: string
                        example: "ye.seob_"
        "500":
          description: Fail operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FailResponse"

  # 로그인 API
  /api/v1/users/login:
    post:
      tags:
        - User
      summary: User Login
      description: 로그인 API
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                studentId:
                  type: string
                  example: "2023216049"
                pin:
                  type: string
                  example: "1234"

      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultType:
                    type: string
                    example: "SUCCESS"
                  error:
                    type: string
                    nullable: true
                    example: null
                  success:
                    type: object
                    properties:
                      loginUser:
                        type: object
                        properties:
                          userId:
                            type: integer
                            example: 2
                          name:
                            type: string
                            example: "변예섭"
                          studentId:
                            type: string
                            example: "2023216049"
                          email:
                            type: string
                            example: "ys031027@skuniv.ac.kr"
                          kakaoId:
                            type: string
                            nullable: true
                            example: null
                          instaId:
                            type: string
                            example: "ye.seob_"

              #실패 응답
        "500":
          description: Fail operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FailResponse"

  # ======================= 매칭 API ======================

  # 그룹 매칭 조회 API
  /api/v1/matching/personal:
    get:
      tags:
        - Matching
      summary: Personal Matching
      description: 개인 매칭 조회 API
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultType:
                    type: string
                    example: "SUCCESS"
                  error:
                    type: string
                    nullable: true
                    example: null
                  success:
                    type: object
                    properties:
                      matchId:
                        type: integer
                        example: 3
                      matchType:
                        type: string
                        example: "INDIVIDUAL"
                      personalNum:
                        type: integer
                        example: 49
                      groupNum:
                        type: integer
                        nullable: true
                        example: null
                      matchParticipants:
                        type: array
                        items:
                          type: object
                          properties:
                            userId:
                              type: integer
                              example: 2
                            matchId:
                              type: integer
                              example: 3
                            user:
                              type: object
                              properties:
                                userId:
                                  type: integer
                                  example: 2
                                name:
                                  type: string
                                  example: "변예섭"

              #실패 응답
        "500":
          description: Fail operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FailResponse"

  # 그룹 매칭 조회 API
  /api/v1/matching/group:
    get:
      tags:
        - Matching
      summary: Group Matching
      description: 그룹 매칭 조회 API
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultType:
                    type: string
                    example: "SUCCESS"
                  error:
                    type: string
                    nullable: true
                    example: null
                  success:
                    type: object
                    properties:
                      matchId:
                        type: integer
                        example: 2
                      matchType:
                        type: string
                        example: "GROUP"
                      personalNum:
                        type: integer
                        nullable: true
                        example: null
                      groupNum:
                        type: integer
                        example: 17
                      matchParticipants:
                        type: array
                        items:
                          type: object
                          properties:
                            userId:
                              type: integer
                              example: 1
                            matchId:
                              type: integer
                              example: 2
                            user:
                              type: object
                              properties:
                                userId:
                                  type: integer
                                  example: 1
                                name:
                                  type: string
                                  example: "변예섭"
                                studentId:
                                  type: string
                                  example: "2023216051"
        "500":
          description: Fail operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FailResponse"

  # 매칭된 유저의 상세 정보 조회 API
  /api/v1/matching/{userId}:
    get:
      tags:
        - Matching
      summary: Matching User  Info
      description: 매칭된 유저의 상세 정보 조회 API
      parameters:
        - name: userId
          in: path
          description: 조회할 사용자의 ID
          required: true
          schema:
            type: integer
            example: 4
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultType:
                    type: string
                    example: "SUCCESS"
                  error:
                    type: string
                    nullable: true
                    example: null
                  success:
                    type: object
                    properties:
                      userId:
                        type: integer
                        example: 4
                      name:
                        type: string
                        example: "테스트"
                      studentId:
                        type: string
                        example: "2020216049"
                      email:
                        type: string
                        example: "ys031027@skuniv.ac.kr"
                      kakaoId:
                        type: string
                        nullable: true
                        example: null
                      instaId:
                        type: string
                        example: "ye.seob_"
        "500":
          description: Fail operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FailResponse"

  # =========== 글  api ============

  # 게시물 생성 API
  /api/v1/posts:
    post:
      tags:
        - Post
      summary: Create Post
      description: 게시물을 생성하는 API
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  example: "스웨거 테스트"
                content:
                  type: string
                  example: "스웨거 테스트입니다"
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultType:
                    type: string
                    example: "SUCCESS"
                  error:
                    type: string
                    nullable: true
                    example: null
                  success:
                    type: object
                    properties:
                      postId:
                        type: integer
                        example: 37
                      userId:
                        type: integer
                        example: 2
                      title:
                        type: string
                        example: "스웨거 테스트"
                      content:
                        type: string
                        example: "스웨거 테스트입니다"
                      likeCount:
                        type: integer
                        example: 0
                      dislikeCount:
                        type: integer
                        example: 0
                      createdAt:
                        type: string
                        format: date-time
                        example: "2025-03-04T12:52:18.050Z"
                      updatedAt:
                        type: string
                        nullable: true
                        example: null

  # 게시물 목록 조회 API
  /api/v1/posts/list:
    get:
      tags:
        - Post
      summary: Get Post List
      description: 게시물 목록을 조회하는 API
      parameters:
        - name: tag
          in: query
          description: 게시물 태그 (선택 사항)
          required: false
          schema:
            type: string
            example: "프로그래밍"
        - name: lastPostId
          in: query
          description: 마지막 게시물 ID (선택 사항)
          required: false
          schema:
            type: integer
            example: 16
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultType:
                    type: string
                    example: "SUCCESS"
                  error:
                    type: string
                    nullable: true
                    example: null
                  success:
                    type: array
                    items:
                      type: object
                      properties:
                        postId:
                          type: integer
                          example: 17
                        userId:
                          type: integer
                          example: 7
                        title:
                          type: string
                          example: "열일곱 번째 게시글입니다!"
                        content:
                          type: string
                          example: "오늘은 데이터베이스 설계를 공부했어요. 처음에는 어려웠지만 점점 이해가 가더라고요."
                        likeCount:
                          type: integer
                          example: 0
                        dislikeCount:
                          type: integer
                          example: 0
                        createdAt:
                          type: string
                          format: date-time
                          example: "2025-03-03T16:54:21.000Z"
                        updatedAt:
                          type: string
                          format: date-time
                          example: "2025-03-03T16:54:21.000Z"
                        postTags:
                          type: array
                          items:
                            type: object
                            properties:
                              postId:
                                type: integer
                                example: 17
                              tagId:
                                type: integer
                                example: 1
                              tag:
                                type: object
                                properties:
                                  tagId:
                                    type: integer
                                    example: 1
                                  name:
                                    type: string
                                    example: "프로그래밍"

  # 게시물 수정 API
  /api/v1/posts/update/{postId}:
    put:
      tags:
        - Post
      summary: Update Post
      description: 게시물을 수정하는 API
      parameters:
        - name: postId
          in: path
          required: true
          description: 수정할 게시물의 ID
          schema:
            type: integer
            example: 37
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  example: "수정된 게시글 제목"
                content:
                  type: string
                  example: "수정된 게시글 내용"
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultType:
                    type: string
                    example: "SUCCESS"
                  error:
                    type: string
                    nullable: true
                    example: null
                  success:
                    type: object
                    properties:
                      postId:
                        type: integer
                        example: 37
                      userId:
                        type: integer
                        example: 2
                      title:
                        type: string
                        example: "스웨거 테스트 수정"
                      content:
                        type: string
                        example: "스웨거 테스트 수정입니다"
                      likeCount:
                        type: integer
                        example: 0
                      dislikeCount:
                        type: integer
                        example: 0
                      createdAt:
                        type: string
                        format: date-time
                        example: "2025-03-04T12:52:18.050Z"
                      updatedAt:
                        type: string
                        format: date-time
                        example: "2025-03-04T13:03:05.667Z"

  # 게시물 삭제 API
  /api/v1/posts/delete/{postId}:
    delete:
      tags:
        - Post
      summary: Delete Post
      description: 게시물을 삭제하는 API
      parameters:
        - name: postId
          in: path
          required: true
          description: 삭제할 게시물의 ID
          schema:
            type: integer
            example: 4
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultType:
                    type: string
                    example: "SUCCESS"
                  error:
                    type: string
                    nullable: true
                    example: null
                  success:
                    type: object
                    properties:
                      postId:
                        type: integer
                        example: 37
                      userId:
                        type: integer
                        example: 2
                      title:
                        type: string
                        example: "수정된 게시글 제목"
                      content:
                        type: string
                        example: "수정된 게시글 내용ㅈ"
                      likeCount:
                        type: integer
                        example: 0
                      dislikeCount:
                        type: integer
                        example: 0
                      createdAt:
                        type: string
                        format: date-time
                        example: "2025-03-04T12:52:18.050Z"
                      updatedAt:
                        type: string
                        format: date-time
                        example: "2025-03-04T13:04:42.730Z"

  # 내 게시물 조회 API
  /api/v1/posts/my:
    get:
      tags:
        - Post
      summary: Get My Posts
      description: 사용자가 작성한 게시물 목록을 조회하는 API
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultType:
                    type: string
                    example: "SUCCESS"
                  error:
                    type: string
                    nullable: true
                    example: null
                  success:
                    type: array
                    items:
                      type: object
                      properties:
                        postId:
                          type: integer
                          example: 19
                        userId:
                          type: integer
                          example: 2
                        title:
                          type: string
                          example: "열아홉 번째 게시글입니다!"
                        content:
                          type: string
                          example: "오늘도 좋은 하루 되세요! 여러분의 오늘은 어땠나요?"
                        likeCount:
                          type: integer
                          example: 0
                        dislikeCount:
                          type: integer
                          example: 0
                        createdAt:
                          type: string
                          format: date-time
                          example: "2025-03-03T16:54:21.000Z"
                        updatedAt:
                          type: string
                          format: date-time
                          example: "2025-03-03T16:54:21.000Z"

  # 게시물 상세 조회 API
  /api/v1/posts/{postId}:
    get:
      tags:
        - Post
      summary: Get Post Details
      description: 특정 게시물의 상세 정보를 조회하는 API
      parameters:
        - name: postId
          in: path
          required: true
          description: 조회할 게시물의 ID
          schema:
            type: integer
            example: 5
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultType:
                    type: string
                    example: "SUCCESS"
                  error:
                    type: string
                    nullable: true
                    example: null
                  success:
                    type: object
                    properties:
                      postId:
                        type: integer
                        example: 5
                      userId:
                        type: integer
                        example: 3
                      title:
                        type: string
                        example: "다섯 번째 게시글입니다!"
                      content:
                        type: string
                        example: "최근에 풀스택 개발을 시작했어요. 주로 React와 Node.js를 사용하고 있습니다."
                      likeCount:
                        type: integer
                        example: 0
                      dislikeCount:
                        type: integer
                        example: 0
                      createdAt:
                        type: string
                        format: date-time
                        example: "2025-03-03T16:54:21.000Z"
                      updatedAt:
                        type: string
                        format: date-time
                        example: "2025-03-03T16:54:21.000Z"
                      user:
                        type: object
                        properties:
                          userId:
                            type: integer
                            example: 3
                          studentId:
                            type: string
                            example: "2021216049"
                      comments:
                        type: array
                        items:
                          type: object
                          properties:
                            commentId:
                              type: integer
                              example: 9
                            userId:
                              type: integer
                              example: 2
                            postId:
                              type: integer
                              example: 5
                            content:
                              type: string
                              example: "두 번째 답글입니다"
                            createdAt:
                              type: string
                              format: date-time
                              example: "2025-03-04T11:49:44.681Z"
                            updatedAt:
                              type: string
                              format: date-time
                              example: null
                            parentCommentId:
                              type: integer
                              example: null
                            user:
                              type: object
                              properties:
                                userId:
                                  type: integer
                                  example: 2
                                studentId:
                                  type: string
                                  example: "2023216049"
                      postTags:
                        type: array
                        items:
                          type: object
                          properties:
                            postId:
                              type: integer
                              example: 5
                            tagId:
                              type: integer
                              example: 2
                            tag:
                              type: object
                              properties:
                                name:
                                  type: string
                                  example: "알고리즘"

  #====================== 댓글 API ===============

  # 댓글 작성 API
  /api/v1/comments:
    post:
      tags:
        - Comment
      summary: Create Comment
      description: 게시물에 댓글을 작성하는 API
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                postId:
                  type: integer
                  example: 5
                content:
                  type: string
                  example: "스웨거 댓글"
                parentCommentId:
                  type: integer
                  nullable: true
                  example: null
                  description: "대댓글일 경우 필요, 기본값은 null"
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultType:
                    type: string
                    example: "SUCCESS"
                  error:
                    type: string
                    nullable: true
                    example: null
                  success:
                    type: object
                    properties:
                      commentId:
                        type: integer
                        example: 10
                      userId:
                        type: integer
                        example: 2
                      postId:
                        type: integer
                        example: 5
                      content:
                        type: string
                        example: "스웨거 댓글"
                      createdAt:
                        type: string
                        format: date-time
                        example: "2025-03-04T13:21:42.499Z"
                      updatedAt:
                        type: string
                        format: date-time
                        example: null
                      parentCommentId:
                        type: integer
                        example: null

  # 댓글 삭제 API
  /api/v1/comments/delete/{commentId}:
    delete:
      tags:
        - Comment
      summary: Delete Comment
      description: 댓글을 삭제하는 API
      parameters:
        - name: commentId
          in: path
          required: true
          description: 삭제할 댓글의 ID
          schema:
            type: integer
            example: 10
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultType:
                    type: string
                    example: "SUCCESS"
                  error:
                    type: string
                    nullable: true
                    example: null
                  success:
                    type: object
                    properties:
                      count:
                        type: integer
                        example: 1

  # 내 댓글 조회 API
  /api/v1/comments/my:
    get:
      tags:
        - Comment
      summary: Get My Comments
      description: 사용자가 작성한 댓글을 조회하는 API
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultType:
                    type: string
                    example: "SUCCESS"
                  error:
                    type: string
                    nullable: true
                    example: null
                  success:
                    type: array
                    items:
                      type: object
                      properties:
                        commentId:
                          type: integer
                          example: 9
                        userId:
                          type: integer
                          example: 2
                        postId:
                          type: integer
                          example: 5
                        content:
                          type: string
                          example: "두 번째 답글입니다"
                        createdAt:
                          type: string
                          format: date-time
                          example: "2025-03-04T11:49:44.681Z"
                        updatedAt:
                          type: string
                          format: date-time
                          example: null
                        parentCommentId:
                          type: integer
                          example: null

  # ======================= 토큰 API ======================

  # 엑세스 토큰 재발급 api
  /api/v1/auth/refresh:
    post:
      tags:
        - Auth
      summary: Auth
      description: 엑세스 토큰 재발급 API
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultType:
                    type: string
                    example: "SUCCESS"
                  error:
                    type: string
                    nullable: true
                    example: null
                  success:
                    type: object
                    example: {}
        #실패 응답
        "500":
          description: Fail operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FailResponse"

#components
components:
  schemas:
    #실패 응답 Component
    FailResponse:
      type: object
      properties:
        resultType:
          type: string
          default: "ERROR"
        error:
          type: object
          properties:
            errorCode:
              type: string
            reason:
              type: string
            data:
              type: string
        success:
          type: string
          default: null

  #보안 처리
  securitySchemes:
    Bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT

#보안 적용
security:
  - Bearer: []
