openapi: 3.0.3
info:
  title: With Buddy API
  version: 1.0.11
servers:
  - url: http://localhost:3000
  - url: https://api.skuwithbuddy.com
tags:
  - name: User
    description: User API Tag
  - name: Mail
    description: Mail API Tag

  - name: Matching
    description: Matching API Tag
  - name: Post
    description: Post API Tag
  - name: Comment
    description: Comment API Tag
  - name: Auth
    description: Auth API Tag
#api paths
paths:
  # ======================= 유저 API ======================

  # 회원가입 API
  /api/v1/users/signup:
    post:
      tags:
        - User
      summary: User Signup
      description: 회원가입 API
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: "테스트"
                pin:
                  type: string
                  example: "1234"
                studentId:
                  type: string
                  example: "2023216001"
                email:
                  type: string
                  example: "ys031027@skuniv.ac.kr"
                instaId:
                  type: string
                  example: "ye.seob_"
                mbti:
                  type: string
                  example: "ISTP"
                bio:
                  type: string
                  example: "안녕하세요"

      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultType:
                    type: string
                    example: "SUCCESS"
                  error:
                    type: string
                    nullable: true
                    example: null
                  success:
                    type: object
                    properties:
                      userId:
                        type: integer
                        example: 6
                      name:
                        type: string
                        example: "테스트"
                      studentId:
                        type: string
                        example: "2023216001"
                      email:
                        type: string
                        example: "ys031027@skuniv.ac.kr"
                      kakaoId:
                        type: string
                        nullable: true
                        example: null
                      instaId:
                        type: string
                        nullable: true
                        example: "ye.seob_"
                      mbti:
                        type: string
                        nullable: true
                        example: "ISTP"
                      bio:
                        type: string
                        nullable: true
                        example: "안녕하세요"

        "500":
          description: Fail operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FailResponse"

  # 로그인 API
  /api/v1/users/login:
    post:
      tags:
        - User
      summary: User Login
      description: 로그인 API
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                studentId:
                  type: string
                  example: "2023216049"
                pin:
                  type: string
                  example: "1234"

      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultType:
                    type: string
                    example: "SUCCESS"
                  error:
                    type: string
                    nullable: true
                    example: null
                  success:
                    type: object
                    properties:
                      loginUser:
                        type: object
                        properties:
                          userId:
                            type: integer
                            example: 2
                          name:
                            type: string
                            example: "변예섭"
                          studentId:
                            type: string
                            example: "2023216049"
                          email:
                            type: string
                            example: "ys031027@skuniv.ac.kr"
                          kakaoId:
                            type: string
                            nullable: true
                            example: null
                          instaId:
                            type: string
                            nullable: true
                            example: "ye.seob_"
                          mbti:
                            type: string
                            example: "ISTP"
                          bio:
                            type: string
                            nullable: true
                            example: "안녕하세요"

              #실패 응답
        "500":
          description: Fail operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FailResponse"

  # 내 정보 조회 API
  /api/v1/users/my:
    get:
      tags:
        - User
      summary: Get My User Info
      description: 로그인된 사용자의 정보를 가져오는 API
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultType:
                    type: string
                    example: "SUCCESS"
                  error:
                    type: string
                    nullable: true
                    example: null
                  success:
                    type: object
                    properties:
                      userId:
                        type: integer
                        example: 1
                      name:
                        type: string
                        example: "테스트"
                      studentId:
                        type: string
                        example: "2023216049"
                      email:
                        type: string
                        example: "ys031027@skuniv.ac.kr"
                      kakaoId:
                        type: string
                        nullable: true
                        example: null
                      instaId:
                        type: string
                        nullable: true
                        example: "ye.seob_"
                      mbti:
                        type: string
                        example: "ISTP"
                      bio:
                        type: string
                        nullable: true
                        example: null
        "500":
          description: Fail operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FailResponse"

  # 내 정보 수정 API
  /api/v1/users/update:
    patch:
      tags:
        - User
      summary: Update User Info
      description: 사용자의 정보를 업데이트하는 API
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  nullable: true
                  example: "변예섭"
                kakaoId:
                  type: string
                  nullable: true
                  example: "test"
                instaId:
                  type: string
                  nullable: true
                  example: "insta"
                pin:
                  type: string
                  example: "1027"
                mbti:
                  type: string
                  nullable: true
                  example: "INFP"
                bio:
                  type: string
                  nullable: true
                  example: "안녕"
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultType:
                    type: string
                    example: "SUCCESS"
                  error:
                    type: string
                    nullable: true
                    example: null
                  success:
                    type: object
                    properties:
                      userId:
                        type: integer
                        example: 1
                      name:
                        type: string
                        example: "변예섭"
                      pin:
                        type: string
                        example: "$2b$04$q6Z7/JzGVjIul.nQvTzbd.9zlFeHMjg0QDrBiJlXzfrJbIs2w0UhS"
                      studentId:
                        type: string
                        example: "2023216049"
                      email:
                        type: string
                        example: "ys031027@skuniv.ac.kr"
                      kakaoId:
                        type: string
                        nullable: true
                        example: "test"
                      instaId:
                        type: string
                        nullable: true
                        example: "insta"
                      mbti:
                        type: string
                        nullable: true
                        example: "INFP"
                      bio:
                        type: string
                        nullable: true
                        example: "안녕"
        "500":
          description: Fail operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FailResponse"

    /api/v1/users/update/pin:
      patch:
        tags:
          - User
        summary: Update User Pin
        description: 사용자의 비밀번호(핀)을 업데이트하는 API
        requestBody:
          required: true
          content:
            application/json:
              schema:
                type: object
                properties:
                  email:
                    type: string
                    example: "ys031027@skuniv.ac.kr"
                  pin:
                    type: string
                    example: "1234"
        responses:
          "200":
            description: Successful operation
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    resultType:
                      type: string
                      example: "SUCCESS"
                    error:
                      type: string
                      nullable: true
                      example: null
                    success:
                      type: object
                      properties:
                        userId:
                          type: integer
                          example: 1
                        name:
                          type: string
                          example: "변예섭"
                        studentId:
                          type: string
                          example: "2023216049"
                        email:
                          type: string
                          example: "ys031027@skuniv.ac.kr"
                        kakaoId:
                          type: string
                          nullable: true
                          example: "test"
                        instaId:
                          type: string
                          nullable: true
                          example: "insta"
                        mbti:
                          type: string
                          example: "INFP"
                        bio:
                          type: string
                          nullable: true
                          example: "안녕"
          "500":
            description: Fail operation
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/FailResponse"

  # pin 번호 업데이트
  /api/v1/users/update/pin:
    patch:
      tags:
        - User
      summary: Update User Pin
      description: 사용자의 비밀번호(핀)을 업데이트하는 API
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: "ys031027@skuniv.ac.kr"
                pin:
                  type: string
                  example: "1234"
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultType:
                    type: string
                    example: "SUCCESS"
                  error:
                    type: string
                    nullable: true
                    example: null
                  success:
                    type: object
                    properties:
                      userId:
                        type: integer
                        example: 1
                      name:
                        type: string
                        example: "변예섭"
                      studentId:
                        type: string
                        example: "2023216049"
                      email:
                        type: string
                        example: "ys031027@skuniv.ac.kr"
                      kakaoId:
                        type: string
                        nullable: true
                        example: "test"
                      instaId:
                        type: string
                        nullable: true
                        example: "insta"
                      mbti:
                        type: string
                        example: "INFP"
                      bio:
                        type: string
                        nullable: true
                        example: "안녕"
        "500":
          description: Fail operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FailResponse"

  # 회원 탈퇴
  /api/v1/users/delete:
    delete:
      tags:
        - User
      summary: Delete User
      description: 회원 탈퇴 API
      requestBody:
        required: false
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultType:
                    type: string
                    example: "SUCCESS"
                  error:
                    type: string
                    nullable: true
                    example: null
                  success:
                    type: object
                    properties:
                      userId:
                        type: integer
                        example: 7
                      name:
                        type: string
                        example: "테스트"
                      pin:
                        type: string
                        example: "$2b$10$HwgpWTZFKV8bFMjd2IlIj.yySuhGjKD9cgIn04KKjiIcedG2cGX.W"
                      studentId:
                        type: string
                        example: "2022322116003"
                      email:
                        type: string
                        example: "ys01312201227@skuniv.ac.kr"
                      kakaoId:
                        type: string
                        nullable: true
                        example: null
                      instaId:
                        type: string
                        nullable: true
                        example: "ye.seob_"
                      mbti:
                        type: string
                        nullable: true
                        example: null
                      bio:
                        type: string
                        nullable: true
                        example: "안녕하세요"
        "500":
          description: Fail operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FailResponse"

  # 로그아웃
  /api/v1/users/logout:
    post:
      tags:
        - User
      summary: User Logout
      description: 회원 로그아웃 API
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultType:
                    type: string
                    example: "SUCCESS"
                  error:
                    type: string
                    nullable: true
                    example: null
                  success:
                    type: string
                    example: "로그아웃 되었습니다"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FailResponse"

  # ======================== 메일 API ========================

  # 이메일 전송 API
  /api/v1/mails/send:
    post:
      tags:
        - Mail
      summary: Send Email
      description: 이메일 전송 API
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: "ys031027@skuniv.ac.kr"

      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultType:
                    type: string
                    example: "SUCCESS"
                  error:
                    type: string
                    nullable: true
                    example: null
                  success:
                    type: array
                    items:
                      type: string
                      example: "ys031027@skuniv.ac.kr"

        "500":
          description: Fail operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FailResponse"

  # 이메일 인증 API
  /api/v1/mails/verify:
    post:
      tags:
        - Mail
      summary: Verify Email
      description: 이메일 인증 API
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: "ys031027@skuniv.ac.kr"
                code:
                  type: string
                  example: "306020"

      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultType:
                    type: string
                    example: "SUCCESS"
                  error:
                    type: string
                    nullable: true
                    example: null
                  success:
                    type: string
                    example: "성공"

        "500":
          description: Fail operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FailResponse"

  # ======================= 매칭 API ======================

  # 그룹 매칭 조회 API
  /api/v1/matching/personal:
    get:
      tags:
        - Matching
      summary: Personal Matching
      description: 개인 매칭 조회 API
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultType:
                    type: string
                    example: "SUCCESS"
                  error:
                    type: string
                    nullable: true
                    example: null
                  success:
                    type: object
                    properties:
                      matchId:
                        type: integer
                        example: 3
                      matchType:
                        type: string
                        example: "INDIVIDUAL"
                      personalNum:
                        type: integer
                        example: 49
                      groupNum:
                        type: integer
                        nullable: true
                        example: null
                      matchParticipants:
                        type: array
                        items:
                          type: object
                          properties:
                            userId:
                              type: integer
                              example: 2
                            matchId:
                              type: integer
                              example: 3
                            user:
                              type: object
                              properties:
                                userId:
                                  type: integer
                                  example: 2
                                name:
                                  type: string
                                  example: "변예섭"

              #실패 응답
        "500":
          description: Fail operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FailResponse"

  # 그룹 매칭 조회 API
  /api/v1/matching/group:
    get:
      tags:
        - Matching
      summary: Group Matching
      description: 그룹 매칭 조회 API
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultType:
                    type: string
                    example: "SUCCESS"
                  error:
                    type: string
                    nullable: true
                    example: null
                  success:
                    type: object
                    properties:
                      matchId:
                        type: integer
                        example: 2
                      matchType:
                        type: string
                        example: "GROUP"
                      personalNum:
                        type: integer
                        nullable: true
                        example: null
                      groupNum:
                        type: integer
                        example: 17
                      matchParticipants:
                        type: array
                        items:
                          type: object
                          properties:
                            userId:
                              type: integer
                              example: 1
                            matchId:
                              type: integer
                              example: 2
                            user:
                              type: object
                              properties:
                                userId:
                                  type: integer
                                  example: 1
                                name:
                                  type: string
                                  example: "변예섭"
                                studentId:
                                  type: string
                                  example: "2023216051"
        "500":
          description: Fail operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FailResponse"

  # 매칭된 유저의 상세 정보 조회 API
  /api/v1/matching/{userId}:
    get:
      tags:
        - Matching
      summary: Matching User  Info
      description: 매칭된 유저의 상세 정보 조회 API
      parameters:
        - name: userId
          in: path
          description: 조회할 사용자의 ID
          required: true
          schema:
            type: integer
            example: 4
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultType:
                    type: string
                    example: "SUCCESS"
                  error:
                    type: string
                    nullable: true
                    example: null
                  success:
                    type: object
                    properties:
                      userId:
                        type: integer
                        example: 4
                      name:
                        type: string
                        example: "테스트"
                      studentId:
                        type: string
                        example: "2020216049"
                      email:
                        type: string
                        example: "ys031027@skuniv.ac.kr"
                      kakaoId:
                        type: string
                        nullable: true
                        example: null
                      instaId:
                        type: string
                        example: "ye.seob_"
        "500":
          description: Fail operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FailResponse"

  # =========== 글  api ============

  # 게시물 생성 API
  /api/v1/posts:
    post:
      tags:
        - Post
      summary: Create Post
      description: 게시물을 생성하는 API
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  example: "제목"
                content:
                  type: string
                  example: "내용"
                postTags:
                  type: array
                  items:
                    type: string
                  example: ["#코딩", "#백엔드"]
                  nullable: true
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultType:
                    type: string
                    example: "SUCCESS"
                  error:
                    type: string
                    nullable: true
                    example: null
                  success:
                    type: object
                    properties:
                      postId:
                        type: integer
                        example: 5
                      userId:
                        type: integer
                        example: 5
                      title:
                        type: string
                        example: "제목"
                      content:
                        type: string
                        example: "내용"
                      postTags:
                        type: array
                        items:
                          type: string
                        example: ["#코딩", "#백엔드"]
                      likeCount:
                        type: integer
                        example: 0
                      dislikeCount:
                        type: integer
                        example: 0
                      createdAt:
                        type: string
                        format: date-time
                        example: "2025-03-15T12:04:41.881Z"
                      updatedAt:
                        type: string
                        nullable: true
                        example: null
        #실패 응답
        "500":
          description: Fail operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FailResponse"

  /api/v1/posts/list:
    get:
      tags:
        - Post
      summary: Get Post List
      description: 게시물 목록을 가져오는 API
      parameters:
        - name: lastPostId
          in: query
          required: false
          description: 마지막 게시물 ID
          schema:
            type: integer
        - name: sortBy
          in: query
          required: false
          description: 정렬 기준 (최신순, 댓글순, 공감순)
          schema:
            type: string
            enum: [최신순, 댓글순, 공감순]
            default: 최신순
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultType:
                    type: string
                    example: "SUCCESS"
                  error:
                    type: string
                    nullable: true
                    example: null
                  success:
                    type: array
                    items:
                      type: object
                      properties:
                        postId:
                          type: integer
                          example: 3
                        title:
                          type: string
                          example: "a"
                        content:
                          type: string
                          example: "b"
                        createdAt:
                          type: string
                          format: date-time
                          example: "2025-03-15T18:17:42.000Z"
                        likedBy:
                          type: array
                          items:
                            type: object
                            properties:
                              userId:
                                type: integer
                                example: 5
                              postId:
                                type: integer
                                example: 3
                        _count:
                          type: object
                          properties:
                            comments:
                              type: integer
                              example: 0
                            likedBy:
                              type: integer
                              example: 2
        "500":
          description: Fail operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FailResponse"

  /api/v1/posts/update/{postId}:
    put:
      tags:
        - Post
      summary: Update Post
      description: 게시물을 수정하는 API
      parameters:
        - name: postId
          in: path
          required: true
          description: 수정할 게시물의 ID
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  example: "스웨거 테스트 수정"
                content:
                  type: string
                  example: "스웨거 테스트 수정입니다 "
                postTags:
                  type: array
                  items:
                    type: string
                  example: ["#코딩", "#백엔드"]
                  nullable: true
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultType:
                    type: string
                    example: "SUCCESS"
                  error:
                    type: string
                    nullable: true
                    example: null
                  success:
                    type: object
                    properties:
                      postId:
                        type: integer
                        example: 4
