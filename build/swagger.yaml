openapi: 3.0.3
info:
  title: WithBuddy Server API
  version: 1.0.11
servers:
  - url: http://localhost:3000
tags:
  - name: User
    description: User API Tag
  - name: Auth
    description: Auth API Tag
  - name: Matching
    description: Matching API Tag

#api paths
paths:
  # ======================= 유저 API ======================

  # 회원가입 API
  /api/v1/users/signup:
    post:
      tags:
        - User
      summary: User Signup
      description: 회원가입 API
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: "테스트"
                pin:
                  type: string
                  example: "1234"
                studentId:
                  type: string
                  example: "2023216001"
                email:
                  type: string
                  example: "ys031027@skuniv.ac.kr"
                instaId:
                  type: string
                  example: "ye.seob_"
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultType:
                    type: string
                    example: "SUCCESS"
                  error:
                    type: string
                    nullable: true
                    example: null
                  success:
                    type: object
                    properties:
                      userId:
                        type: integer
                        example: 6
                      name:
                        type: string
                        example: "테스트"
                      studentId:
                        type: string
                        example: "2023216001"
                      email:
                        type: string
                        example: "ys031027@skuniv.ac.kr"
                      kakaoId:
                        type: string
                        nullable: true
                        example: null
                      instaId:
                        type: string
                        example: "ye.seob_"
        "500":
          description: Fail operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FailResponse"

  # 로그인 API
  /api/v1/users/login:
    post:
      tags:
        - User
      summary: User Login
      description: 로그인 API
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                studentId:
                  type: string
                  example: "2023216049"
                pin:
                  type: string
                  example: "1234"

      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultType:
                    type: string
                    example: "SUCCESS"
                  error:
                    type: string
                    nullable: true
                    example: null
                  success:
                    type: object
                    properties:
                      loginUser:
                        type: object
                        properties:
                          userId:
                            type: integer
                            example: 2
                          name:
                            type: string
                            example: "변예섭"
                          studentId:
                            type: string
                            example: "2023216049"
                          email:
                            type: string
                            example: "ys031027@skuniv.ac.kr"
                          kakaoId:
                            type: string
                            nullable: true
                            example: null
                          instaId:
                            type: string
                            example: "ye.seob_"

              #실패 응답
        "500":
          description: Fail operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FailResponse"

  # 엑세스 토큰 재발급 api
  /api/v1/auth/refresh:
    post:
      tags:
        - Auth
      summary: Auth
      description: 엑세스 토큰 재발급 API
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultType:
                    type: string
                    example: "SUCCESS"
                  error:
                    type: string
                    nullable: true
                    example: null
                  success:
                    type: object
                    example: {}
        #실패 응답
        "500":
          description: Fail operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FailResponse"

  # ======================= 매칭 API ======================

  # 그룹 매칭 조회 API
  /api/v1/matching/personal:
    get:
      tags:
        - Matching
      summary: Personal Matching
      description: 개인 매칭 조회 API
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultType:
                    type: string
                    example: "SUCCESS"
                  error:
                    type: string
                    nullable: true
                    example: null
                  success:
                    type: object
                    properties:
                      matchId:
                        type: integer
                        example: 3
                      matchType:
                        type: string
                        example: "INDIVIDUAL"
                      personalNum:
                        type: integer
                        example: 49
                      groupNum:
                        type: integer
                        nullable: true
                        example: null
                      matchParticipants:
                        type: array
                        items:
                          type: object
                          properties:
                            userId:
                              type: integer
                              example: 2
                            matchId:
                              type: integer
                              example: 3
                            user:
                              type: object
                              properties:
                                userId:
                                  type: integer
                                  example: 2
                                name:
                                  type: string
                                  example: "변예섭"

              #실패 응답
        "500":
          description: Fail operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FailResponse"

  # 그룹 매칭 조회 API
  /api/v1/matching/group:
    get:
      tags:
        - Matching
      summary: Group Matching
      description: 그룹 매칭 조회 API
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultType:
                    type: string
                    example: "SUCCESS"
                  error:
                    type: string
                    nullable: true
                    example: null
                  success:
                    type: object
                    properties:
                      matchId:
                        type: integer
                        example: 2
                      matchType:
                        type: string
                        example: "GROUP"
                      personalNum:
                        type: integer
                        nullable: true
                        example: null
                      groupNum:
                        type: integer
                        example: 17
                      matchParticipants:
                        type: array
                        items:
                          type: object
                          properties:
                            userId:
                              type: integer
                              example: 1
                            matchId:
                              type: integer
                              example: 2
                            user:
                              type: object
                              properties:
                                userId:
                                  type: integer
                                  example: 1
                                name:
                                  type: string
                                  example: "변예섭"
                                studentId:
                                  type: string
                                  example: "2023216051"
        "500":
          description: Fail operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FailResponse"

  # 매칭된 유저의 상세 정보 조회 API
  /api/v1/matching/{userId}:
    get:
      tags:
        - Matching
      summary: Matching User  Info
      description: 매칭된 유저의 상세 정보 조회 API
      parameters:
        - name: userId
          in: path
          description: 조회할 사용자의 ID
          required: true
          schema:
            type: integer
            example: 4
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultType:
                    type: string
                    example: "SUCCESS"
                  error:
                    type: string
                    nullable: true
                    example: null
                  success:
                    type: object
                    properties:
                      userId:
                        type: integer
                        example: 4
                      name:
                        type: string
                        example: "테스트"
                      studentId:
                        type: string
                        example: "2020216049"
                      email:
                        type: string
                        example: "ys031027@skuniv.ac.kr"
                      kakaoId:
                        type: string
                        nullable: true
                        example: null
                      instaId:
                        type: string
                        example: "ye.seob_"
        "500":
          description: Fail operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FailResponse"
#components
components:
  schemas:
    #실패 응답 Component
    FailResponse:
      type: object
      properties:
        resultType:
          type: string
          default: "ERROR"
        error:
          type: object
          properties:
            errorCode:
              type: string
            reason:
              type: string
            data:
              type: string
        success:
          type: string
          default: null

  #보안 처리
  securitySchemes:
    Bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT

#보안 적용
security:
  - Bearer: []
