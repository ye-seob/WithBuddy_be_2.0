name: deploy-main
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 코드
        uses: actions/checkout@v3

      - name: Node.js 버전 설정
        uses: actions/setup-node@v3
        with:
          node-version: 18
      # Step: 프로젝트 종속성 설치
      - name: 종속성 설치
        run: npm install
      - name: 빌드
        run: npm run build

      - name: 프로젝트 실행
        run: npm run start
        env:
          PORT: ${{ secrets.PORT }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: 원격 접속 배포
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.SSH_HOST }} # 원격 서버의 호스트명 또는 IP 주소
          username: ${{ secrets.USER }} # SSH 인증을 위한 사용자 이름
          password: ${{ secrets.SSH_KEY }} # SSH 인증을 위한 비밀번호
          port: 22 # SSH 포트
          script: |
            cd /home/ubuntu/WithBuddy_be_2.0                      # 원격 서버에서 프로젝트 디렉토리로 이동
            git pull                            # Git 저장소에서 최신 변경사항 가져오기
            npm ci                              # CI를 위한 의존성 고려
            npm build                           # 프로젝트 빌드
            pm2 reload ecosystem.config.js
