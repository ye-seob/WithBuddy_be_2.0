name: deploy-main
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest

    steps:
      - name: Create .env file
        run: |
          echo "PORT=${{ secrets.PORT }}" >> .env
          echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> .env
          echo "JWT_SECRET_ACCESS_KEY=${{ secrets.JWT_SECRET_ACCESS_KEY }}" >> .env
          echo "JWT_SECRET_REFRESH_KEY=${{ secrets.JWT_SECRET_REFRESH_KEY }}" >> .env
          echo "EMAIL=${{ secrets.EMAIL }}" >> .env
          echo "SMTPPASSWORD=${{ secrets.SMTPPASSWORD }}" >> .env

      - name: Copy .env file to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          source: ".env"
          target: "/home/ubuntu/WithBuddy_be_2.0"
          debug: true
          overwrite: true

      - name: Install code and dependencies
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            cd /home/ubuntu/WithBuddy_be_2.0
            git pull origin main
            npm install --force
            npx prisma generate
            npx prisma migrate deploy

      - name: Execute code
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            cd /home/ubuntu/WithBuddy_be_2.0
            # 빌드
            npm run build || exit 1
            # 서비스 재시작 (서비스가 실행되지 않으면 시작)
            pm2 status withbuddy_be_2 || pm2 start withbuddy_be_2
            pm2 restart withbuddy_be_2
