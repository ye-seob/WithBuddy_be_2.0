name: Oracle Cloud Integration

on:
  push:
    branches:
      - main

jobs:
  setup-oci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up OCI CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip
          pip3 install oci-cli

      - name: Configure OCI CLI using oci configure
        run: |
          echo -e "${{ secrets.OCI_USER }}\n${{ secrets.OCI_FINGERPRINT }}\n${{ secrets.OCI_KEY }}\n${{ secrets.OCI_TENANCY }}\n${{ secrets.OCI_REGION }}" | oci setup config

      - name: Check OCI config file
        run: |
          cat ~/.oci/config

      - name: Test OCI CLI connectivity
        run: |
          oci compute instance list --compartment-id ${OCI_TENANCY}

      - name: Run custom OCI operations
        run: |
          echo "OCI 작업 실행"
          # 여기서 오라클 클라우드 리소스를 관리하는 커스텀 명령어를 실행하세요
