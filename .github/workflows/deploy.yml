name: deploy-main
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest

    steps:
      - name: Create .env file
        run: |
          echo "PORT=${{ secrets.PORT }}" >> .env
          echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> .env

      - name: Copy .env file to EC2 with Debug
        run: |
          scp -v -i ${{ secrets.SSH_KEY }} -P 22 .env ${{ secrets.USER }}@${{ secrets.SSH_HOST }}:/home/ubuntu/WithBuddy_be_2.0

      - name: Install code and dependencies with Debug
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            cd /home/ubuntu/WithBuddy_be_2.0
            git pull origin main
            npm install --force --verbose
            npx prisma generate --verbose
            npx prisma migrate deploy --verbose

      - name: Execute code with Debug
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            cd /home/ubuntu/WithBuddy_be_2.0
            pm2 kill
            npm run build --verbose
            pm2 start ecosystem.config.cjs --no-daemon
