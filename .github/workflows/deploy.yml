name: deploy-main

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa 
          chmod 600 ~/.ssh/id_rsa  

          cat >>~/.ssh/config <<END  
          Host WithBuddy_be_2.0 
            HostName $SSH_HOST 
            User $USER  
            IdentityFile ~/.ssh/id_rsa 
            StrictHostKeyChecking no 
          END
        env:
          USER: ubuntu
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          PORT: ${{ secrets.PORT }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET_ACCESS_KEY: ${{ secrets.JWT_SECRET_ACCESS_KEY }}
          JWT_SECRET_REFRESH_KEY: ${{ secrets.JWT_SECRET_REFRESH_KEY }}
          EMAIL: ${{ secrets.EMAIL }}
          SMTPPASSWORD: ${{ secrets.SMTPPASSWORD }}

      - name: Install dependencies
        run: |
          ssh WithBuddy_be_2.0 'npm install --prefix /home/ubuntu/WithBuddy_be_2.0'

      - name: Copy systemd service file
        run: |
          ssh WithBuddy_be_2.0 '
            echo "[Unit]
            Description=WithBuddy_be_2
            After=network.target

            [Service]
            User=${USER}
            ExecStart=/usr/bin/npm run dev --prefix /home/ubuntu/WithBuddy_be_2.0 
            Restart=always

            [Install]
            WantedBy=multi-user.target" | sudo tee /etc/systemd/system/app.service 
          '

      - name: Enable systemd service
        run: |
          ssh WithBuddy_be_2.0 'sudo systemctl daemon-reload'
          ssh WithBuddy_be_2.0 'sudo systemctl enable app'

      - name: Restart systemd service
        run: |
          ssh WithBuddy_be_2.0 'sudo systemctl restart app'
