name: deploy-main

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          cat >>~/.ssh/config <<END
          Host withbuddy
            HostName $SSH_HOST
            User $USER
            IdentityFile ~/.ssh/id_rsa
            StrictHostKeyChecking no
          END
        env:
          USER: ubuntu
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_KEY: ${{ secrets.SSH_KEY }}

      - name: Copy Workspace
        run: |
          ssh withbuddy 'sudo mkdir -p /opt/app'
          ssh withbuddy 'sudo chown ubuntu:ubuntu /opt/app'
          scp -r ./[!.]* withbuddy:/opt/app

      - name: Install dependencies
        run: |
          ssh withbuddy 'npm install --prefix /opt/app/'

      - name: Copy systemd service file
        run: |
          ssh withbuddy '
            echo "[Unit]
            Description=WithBuddy Project
            After=network.target

            [Service]
            User=${USER}
            ExecStart=/usr/bin/npm run dev --prefix /opt/app/
            Restart=always

            [Install]
            WantedBy=multi-user.target" | sudo tee /etc/systemd/system/app.service
          '

      - name: Enable systemd service
        run: |
          ssh withbuddy 'sudo systemctl daemon-reload'
          ssh withbuddy 'sudo systemctl enable app'

      - name: Restart systemd service
        run: |
          ssh withbuddy 'sudo systemctl restart app'
