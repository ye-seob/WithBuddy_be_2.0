name: deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest

    steps:
      - name: Install code and install dependencies
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            cd /home/ubuntu/WithBuddy_be_2.0
            git pull origin main
            npm install
            npm exec prisma generate
            npm exec prisma migrate deploy

      - name: Execute code and restart app
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            cd /home/ubuntu/WithBuddy_be_2.0
            pm2 kill || true  # pm2 프로세스가 없으면 에러가 발생할 수 있어, 에러를 무시하도록 설정
            npm run build
            pm2 start ecosystem.config.json
